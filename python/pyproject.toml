[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iq-files"
version = "0.1.1"
authors = [
  { name = "Terry Joel Casani Valencia" },
]
description = "Fast, lightweight I/Q complex signal file reading and writing for SDR in Python (RTL-SDR, HackRF, bladeRF, LimeSDR, GNU Radio, WAV, CSV)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]
keywords = ["sdr", "iq", "dsp", "radio", "signal", "bladerf", "hackrf", "rtlsdr", "limesdr", "gnuradio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Communications :: Ham Radio",
]

[project.urls]
"Homepage" = "https://github.com/tcasaniv/iq-files"
"Documentation" = "https://github.com/tcasaniv/iq-files/tree/main/python#readme"
"Bug Tracker" = "https://github.com/tcasaniv/iq-files/issues"
"Source Code" = "https://github.com/tcasaniv/iq-files/tree/main/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"iq_files" = ["py.typed"]
